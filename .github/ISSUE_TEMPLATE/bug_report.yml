name: Bug Report
description: Create a report to help us improve
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened...
    validations:
      required: true
  
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true
  
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
  
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true
  
  - type: input
    id: idea_version
    attributes:
      label: IDEA/PyCharm Version
      placeholder: "e.g. 2026.1 EAP 5"
    validations:
      required: true
  
  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.11"
    validations:
      required: true
  
  - type: textarea
    id: diagnostic_data
    attributes:
      label: Diagnostic Data
      description: Please provide any diagnostic information, error messages, logs, or stack traces
      placeholder: Paste error messages, logs, or diagnostic output here...
    validations:
      required: false
  
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
