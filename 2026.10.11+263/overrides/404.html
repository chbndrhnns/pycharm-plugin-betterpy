<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found - BetterPy documentation</title>
    <script>
      (function () {
        try {
          for (var index = 0; index < localStorage.length; index += 1) {
            var key = localStorage.key(index);
            if (!key || !key.endsWith(".__palette")) {
              continue;
            }
            var palette = JSON.parse(localStorage.getItem(key) || "null");
            var scheme = palette && palette.color && palette.color.scheme;
            if (scheme === "slate" || scheme === "default") {
              document.documentElement.dataset.theme = scheme === "slate" ? "dark" : "light";
              return;
            }
          }
        } catch (error) {
          // Fall back to the system color scheme below.
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bp-bg: #ffffff;
        --bp-fg: rgba(0, 0, 0, 0.87);
        --bp-muted: rgba(0, 0, 0, 0.54);
        --bp-panel: #ffffff;
        --bp-border: rgba(0, 0, 0, 0.12);
        --bp-shadow: rgba(0, 0, 0, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bp-bg: #1e2129;
          --bp-fg: #ffffff;
          --bp-muted: rgba(255, 255, 255, 0.7);
          --bp-panel: #1e2129;
          --bp-border: rgba(255, 255, 255, 0.12);
          --bp-shadow: rgba(0, 0, 0, 0.35);
        }
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bp-bg: #ffffff;
        --bp-fg: rgba(0, 0, 0, 0.87);
        --bp-muted: rgba(0, 0, 0, 0.54);
        --bp-panel: #ffffff;
        --bp-border: rgba(0, 0, 0, 0.12);
        --bp-shadow: rgba(0, 0, 0, 0.08);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bp-bg: #1e2129;
        --bp-fg: #ffffff;
        --bp-muted: rgba(255, 255, 255, 0.7);
        --bp-panel: #1e2129;
        --bp-border: rgba(255, 255, 255, 0.12);
        --bp-shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bp-bg);
        color: var(--bp-fg);
        font: 400 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem;
        border: 1px solid var(--bp-border);
        border-radius: 0.25rem;
        background: var(--bp-panel);
        box-shadow: 0 18px 50px var(--bp-shadow);
      }

      .eyebrow {
        margin: 0 0 0.4rem;
        color: var(--bp-muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.05;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--bp-muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        min-height: 2.35rem;
        padding: 0.45rem 0.8rem;
        border: 1px solid var(--bp-border);
        border-radius: 0.2rem;
        color: var(--bp-fg);
        font-weight: 700;
        text-decoration: none;
      }

      a.button.primary {
        border-color: var(--bp-fg);
        background: var(--bp-fg);
        color: var(--bp-panel);
      }

      a {
        color: var(--bp-fg);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">BetterPy documentation</p>
      <h1>Page not found</h1>
      <p>
        The docs link may have moved, the version may no longer be published,
        or the URL may contain a typo.
      </p>
      <div class="actions">
        <a class="button primary" href="https://chbndrhnns.github.io/pycharm-plugin-betterpy/latest/">Open the latest docs</a>
        <a class="button" href="https://chbndrhnns.github.io/pycharm-plugin-betterpy/latest/features/">Browse all features</a>
      </div>
      <p id="anchor-hint"></p>
    </main>
    <script>
      (function () {
        var hash = window.location.hash.replace(/^#/, "");
        var hint = document.getElementById("anchor-hint");
        if (!hash || !hint) {
          return;
        }

        var base = "https://chbndrhnns.github.io/pycharm-plugin-betterpy/latest";

        function show(link, text) {
          hint.textContent = "Looking for a specific section? ";
          var anchor = document.createElement("a");
          anchor.href = link;
          anchor.textContent = text;
          hint.appendChild(anchor);
          hint.appendChild(document.createTextNode("."));
        }

        fetch(base + "/search.json")
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (index) {
            var items = index && Array.isArray(index.items) ? index.items : [];
            var match = items.find(function (item) {
              return String(item.location || "").endsWith("#" + hash);
            });
            if (match && match.location) {
              show(base + "/" + match.location, "open the matching section");
            } else {
              show(base + "/features/#" + encodeURIComponent(hash), "try the feature overview");
            }
          })
          .catch(function () {
            show(base + "/features/#" + encodeURIComponent(hash), "try the feature overview");
          });
      })();
    </script>
  </body>
</html>
